# Local development database (S1-T0). The API itself does not need it yet: it will from S1-T1.
name: servnova

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: servnova
      POSTGRES_USER: servnova
      # No password in the repository: copy .env.example to .env and choose one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env (see .env.example)}
    ports:
      - "127.0.0.1:5432:5432" # reachable from this machine only
    volumes:
      - servnova-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servnova -d servnova"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  servnova-db:
