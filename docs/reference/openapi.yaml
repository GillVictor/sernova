openapi: 3.1.0
info:
  title: ServNova API
  version: '0.2'
  description: 'Généré depuis docs/reference/api-contract.xlsx et data-dictionary.xlsx (ne pas modifier à la main). Les schémas
    marqués `x-schema-status: indicative` ne sont pas encore fixés (voir la feuille Schémas).'
servers:
- url: /api/v1
tags:
- name: auth
- name: users
- name: providers
- name: categories
- name: locations
- name: files
- name: offers
- name: requests
- name: proposals
- name: transactions
- name: payments
- name: webhooks
- name: admin
- name: disputes
- name: deliveries
- name: conversations
- name: notifications
- name: health
paths:
  /auth/register:
    post:
      operationId: postAuthRegister
      summary: Créer un compte (client par défaut)
      tags:
      - auth
      x-ep: EP-001
      x-useCase: UC01
      x-tranche: S1 Socle
      x-access: Public
      description: 'Entrée : phone, password, displayName, language, countryCode, email?. Réponse : 201 {userId} ; code SMS
        envoyé. Notes : Compte en attente de vérification du téléphone'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: {}
                password: {}
                displayName: {}
                language: {}
                countryCode: {}
                email: {}
              x-schema-status: indicative
              required:
              - phone
              - password
              - displayName
              - language
              - countryCode
      security: []
      responses:
        '201':
          description: 201 {userId} ; code SMS envoyé
          content:
            application/json:
              schema:
                type: object
                description: 201 {userId} ; code SMS envoyé
                x-schema-status: indicative
        '409':
          description: 'Codes : PHONE_ALREADY_USED'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'VALIDATION_FAILED, détail dans `errors` ; Codes : VALIDATION_FAILED'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 'Codes : RATE_LIMITED'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/verify-phone:
    post:
      operationId: postAuthVerifyphone
      summary: Confirmer le numéro par code SMS
      tags:
      - auth
      x-ep: EP-002
      x-useCase: UC01
      x-tranche: S1 Socle
      x-access: Public
      description: 'Entrée : phone, code. Réponse : 200 {accessToken, refreshToken}. Notes : Passe le niveau N0 à N1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: {}
                code: {}
              x-schema-status: indicative
              required:
              - phone
              - code
      security: []
      responses:
        '200':
          description: 200 {accessToken, refreshToken}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenPair'
        '422':
          description: 'VALIDATION_FAILED, détail dans `errors` ; Codes : CODE_EXPIRED, CODE_INVALID'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 'Codes : RATE_LIMITED'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/resend-code:
    post:
      operationId: postAuthResendcode
      summary: Renvoyer le code SMS
      tags:
      - auth
      x-ep: EP-003
      x-useCase: UC01
      x-tranche: S1 Socle
      x-access: Public
      description: 'Entrée : phone. Réponse : 204. Notes : Limite stricte par numéro'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: {}
              x-schema-status: indicative
              required:
              - phone
      security: []
      responses:
        '204':
          description: '204'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: 'Codes : RATE_LIMITED'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/login:
    post:
      operationId: postAuthLogin
      summary: Se connecter
      tags:
      - auth
      x-ep: EP-004
      x-useCase: UC01
      x-tranche: S1 Socle
      x-access: Public
      description: 'Entrée : phone, password. Réponse : 200 {accessToken, refreshToken}. Notes : Accès 15 min ; renouvellement
        30 jours'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: {}
                password: {}
              x-schema-status: indicative
              required:
              - phone
              - password
      security: []
      responses:
        '200':
          description: 200 {accessToken, refreshToken}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenPair'
        '401':
          description: 'Codes : INVALID_CREDENTIALS'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 'Codes : PHONE_NOT_VERIFIED'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '423':
          description: 'Codes : ACCOUNT_SUSPENDED'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/refresh:
    post:
      operationId: postAuthRefresh
      summary: Renouveler les jetons (rotation)
      tags:
      - auth
      x-ep: EP-005
      x-useCase: UC01
      x-tranche: S1 Socle
      x-access: Public
      description: 'Entrée : refreshToken. Réponse : 200 nouveaux jetons. Notes : Un jeton déjà utilisé révoque la famille'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: {}
              x-schema-status: indicative
              required:
              - refreshToken
      security: []
      responses:
        '200':
          description: 200 nouveaux jetons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenPair'
        '401':
          description: 'Codes : TOKEN_EXPIRED, TOKEN_REVOKED'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /auth/logout:
    post:
      operationId: postAuthLogout
      summary: Se déconnecter
      tags:
      - auth
      x-ep: EP-006
      x-useCase: UC01
      x-tranche: S1 Socle
      x-access: Authentifié
      description: 'Entrée : refreshToken. Réponse : 204. Notes : Révoque le jeton'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: {}
              x-schema-status: indicative
              required:
              - refreshToken
      security:
      - bearerAuth: []
      responses:
        '204':
          description: '204'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /auth/password/forgot:
    post:
      operationId: postAuthPasswordForgot
      summary: Demander la réinitialisation
      tags:
      - auth
      x-ep: EP-007
      x-useCase: UC01
      x-tranche: S1 Socle
      x-access: Public
      description: 'Entrée : phone. Réponse : 204 (toujours). Notes : Ne révèle pas l''existence du compte'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: {}
              x-schema-status: indicative
              required:
              - phone
      security: []
      responses:
        '204':
          description: 204 (toujours)
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: 'Codes : RATE_LIMITED'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/password/reset:
    post:
      operationId: postAuthPasswordReset
      summary: Réinitialiser le mot de passe
      tags:
      - auth
      x-ep: EP-008
      x-useCase: UC01
      x-tranche: S1 Socle
      x-access: Public
      description: 'Entrée : phone, code, newPassword. Réponse : 204. Notes : Révoque tous les jetons'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: {}
                code: {}
                newPassword: {}
              x-schema-status: indicative
              required:
              - phone
              - code
              - newPassword
      security: []
      responses:
        '204':
          description: '204'
        '422':
          description: 'VALIDATION_FAILED, détail dans `errors` ; Codes : CODE_EXPIRED, CODE_INVALID'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /users/me:
    get:
      operationId: getUsersMe
      summary: Lire son compte
      tags:
      - users
      x-ep: EP-009
      x-useCase: UC01
      x-tranche: S1 Socle
      x-access: Authentifié
      description: 'Réponse : 200 {user, capacities, providerStatus, permissions[]}. Notes : providerStatus : Brouillon, Actif,
        Suspendu ou null (aucun profil prestataire) ; permissions : codes de permission administrateur, [] pour un compte
        ordinaire. Voir Schémas : account.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 200 {user, capacities, providerStatus, permissions[]}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/account'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: patchUsersMe
      summary: Modifier son compte
      tags:
      - users
      x-ep: EP-010
      x-useCase: UC01
      x-tranche: S1 Socle
      x-access: Authentifié
      description: 'Entrée : displayName?, language?, email?. Réponse : 200 user.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: {}
                language: {}
                email: {}
              x-schema-status: indicative
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 200 user
          content:
            application/json:
              schema:
                type: object
                description: 200 user
                x-schema-status: indicative
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 'Codes : EMAIL_ALREADY_USED'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'VALIDATION_FAILED, détail dans `errors` ; Codes : VALIDATION_FAILED'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /users/me/provider:
    post:
      operationId: postUsersMeProvider
      summary: Activer la capacité prestataire
      tags:
      - users
      x-ep: EP-011
      x-useCase: UC01
      x-tranche: S1 Socle
      x-access: Authentifié
      description: 'Entrée : businessName, workLocationId, coverageMode, radiusKm?, categoryIds[1..5]. Réponse : 201 providerProfile.
        Notes : Profil créé en statut Actif si le minimum est renseigné'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessName: {}
                workLocationId:
                  type: string
                  format: uuid
                coverageMode: {}
                radiusKm: {}
              x-schema-status: indicative
              required:
              - businessName
              - workLocationId
              - coverageMode
              description: 'Autres éléments de l''entrée (forme libre) : categoryIds[1..5]'
      security:
      - bearerAuth: []
      responses:
        '201':
          description: 201 providerProfile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/providerProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 'Codes : PROVIDER_ALREADY_ACTIVE'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 'VALIDATION_FAILED, détail dans `errors` ; Codes : DOMAIN_LIMIT_EXCEEDED, LOCATION_REQUIRED'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /users/me/devices:
    put:
      operationId: putUsersMeDevices
      summary: Enregistrer le jeton de notification push
      tags:
      - users
      x-ep: EP-012
      x-useCase: UC01
      x-tranche: S1 Socle
      x-access: Authentifié
      description: 'Entrée : fcmToken, platform. Réponse : 204. Notes : Un jeton par appareil'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fcmToken: {}
                platform: {}
              x-schema-status: indicative
              required:
              - fcmToken
              - platform
      security:
      - bearerAuth: []
      responses:
        '204':
          description: '204'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /users/me/devices/{token}:
    delete:
      operationId: deleteUsersMeDevicesByToken
      summary: Retirer un appareil
      tags:
      - users
      x-ep: EP-013
      x-useCase: UC01
      x-tranche: S1 Socle
      x-access: Authentifié
      description: 'Réponse : 204.'
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '204':
          description: '204'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /providers/me:
    get:
      operationId: getProvidersMe
      summary: Lire son profil professionnel
      tags:
      - providers
      x-ep: EP-014
      x-useCase: UC02
      x-tranche: S1 Socle
      x-access: Prestataire
      description: 'Réponse : 200 providerProfile (complet).'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 200 providerProfile (complet)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/providerProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'Codes : PROFILE_NOT_FOUND'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      operationId: patchProvidersMe
      summary: Modifier son profil
      tags:
      - providers
      x-ep: EP-015
      x-useCase: UC02
      x-tranche: S1 Socle
      x-access: Prestataire
      description: 'Entrée : businessName?, description?, portfolioUrl?, videoUrl?, workLocationId?, homeLocationId?, activeLocation?,
        coverageMode?, radiusKm?, workLandmark?. Réponse : 200 providerProfile. Notes : Ne jamais exposer le domicile précis.
        Un champ facultatif envoyé à null est effacé (voir Conventions : PATCH et null).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessName: {}
                description: {}
                portfolioUrl: {}
                videoUrl: {}
                workLocationId:
                  type: string
                  format: uuid
                homeLocationId:
                  type: string
                  format: uuid
                activeLocation: {}
                coverageMode: {}
                radiusKm: {}
                workLandmark: {}
              x-schema-status: indicative
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 200 providerProfile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/providerProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: 'VALIDATION_FAILED, détail dans `errors` ; Codes : ACTIVE_LOCATION_EMPTY, RADIUS_REQUIRED, VALIDATION_FAILED'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /providers/me/domains:
    put:
      operationId: putProvidersMeDomains
      summary: Remplacer ses domaines d'activité
      tags:
      - providers
      x-ep: EP-016
      x-useCase: UC02
      x-tranche: S1 Socle
      x-access: Prestataire
      description: 'Entrée : categoryIds[1..5]. Réponse : 200 domains.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              x-schema-status: indicative
              description: 'Autres éléments de l''entrée (forme libre) : categoryIds[1..5]'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 200 domains
          content:
            application/json:
              schema:
                type: object
                description: 200 domains
                x-schema-status: indicative
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: 'VALIDATION_FAILED, détail dans `errors` ; Codes : CATEGORY_INACTIVE, DOMAIN_LIMIT_EXCEEDED'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /providers/me/verifications:
    post:
      operationId: postProvidersMeVerifications
      summary: Demander une vérification
      tags:
      - providers
      x-ep: EP-017
      x-useCase: UC02
      x-tranche: S1 Socle
      x-access: Prestataire
      description: 'Entrée : type, fileId. Réponse : 201 verification (EnAttente).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type: {}
                fileId:
                  type: string
                  format: uuid
              x-schema-status: indicative
              required:
              - type
              - fileId
      security:
      - bearerAuth: []
      responses:
        '201':
          description: 201 verification (EnAttente)
          content:
            application/json:
              schema:
                type: object
                description: 201 verification (EnAttente)
                x-schema-status: indicative
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'Droit manquant ; Codes : FILE_NOT_OWNED'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'Codes : VERIFICATION_PENDING'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    get:
      operationId: getProvidersMeVerifications
      summary: Suivre ses vérifications
      tags:
      - providers
      x-ep: EP-018
      x-useCase: UC02
      x-tranche: S1 Socle
      x-access: Prestataire
      description: 'Réponse : 200 verification[].'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 200 verification[]
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/verification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /providers/{id}:
    get:
      operationId: getProvidersById
      summary: Lire un profil public
      tags:
      - providers
      x-ep: EP-019
      x-useCase: UC02
      x-tranche: S1 Socle
      x-access: Public
      description: 'Réponse : 200 {businessName, level, rating, reviewCount, quartier, offers[]}. Notes : Localisation au
        niveau quartier seulement'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security: []
      responses:
        '200':
          description: 200 {businessName, level, rating, reviewCount, quartier, offers[]}
          content:
            application/json:
              schema:
                type: object
                description: 200 {businessName, level, rating, reviewCount, quartier, offers[]}
                x-schema-status: indicative
        '404':
          description: 'Codes : NOT_FOUND'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /providers/{id}/reviews:
    get:
      operationId: getProvidersByIdReviews
      summary: Lire les avis d'un prestataire
      tags:
      - providers
      x-ep: EP-020
      x-useCase: UC02
      x-tranche: S1 Socle
      x-access: Public
      description: 'Entrée : limit, cursor. Réponse : 200 {items, nextCursor}.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      security: []
      responses:
        '200':
          description: 200 {items, nextCursor}
          content:
            application/json:
              schema:
                type: object
                description: 200 {items, nextCursor}
                x-schema-status: indicative
        '404':
          description: 'Codes : NOT_FOUND'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /categories:
    get:
      operationId: getCategories
      summary: Arbre des catégories actives
      tags:
      - categories
      x-ep: EP-021
      x-useCase: UC03
      x-tranche: S1 Socle
      x-access: Public
      description: 'Entrée : includeInactive? (réservé à categories.manage). Réponse : 200 category[] (arbre). Notes : Mis
        en cache. Sans includeInactive, seules les catégories actives sont renvoyées ; avec includeInactive par un administrateur,
        les désactivées sont incluses (active = false).'
      parameters:
      - name: includeInactive
        in: query
        required: false
        schema:
          type: boolean
      security: []
      responses:
        '200':
          description: 200 category[] (arbre)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/category'
  /categories/{id}/attributes:
    get:
      operationId: getCategoriesByIdAttributes
      summary: Caractéristiques d'une catégorie
      tags:
      - categories
      x-ep: EP-022
      x-useCase: UC03
      x-tranche: S1 Socle
      x-access: Public
      description: 'Réponse : 200 attributeDefinition[].'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      security: []
      responses:
        '200':
          description: 200 attributeDefinition[]
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/attributeDefinition'
        '404':
          description: 'Codes : NOT_FOUND'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /locations:
    get:
      operationId: getLocations
      summary: Rechercher une localité (saisie assistée)
      tags:
      - locations
      x-ep: EP-023
      x-useCase: UC03
      x-tranche: S1 Socle
      x-access: Public
      description: 'Entrée : countryCode, q, limit. Réponse : 200 location[].'
      parameters:
      - name: countryCode
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      security: []
      responses:
        '200':
          description: 200 location[]
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/location'
  /files:
    post:
      operationId: postFiles
      summary: Téléverser un fichier
      tags:
      - files
      x-ep: EP-024
      x-useCase: UC03
