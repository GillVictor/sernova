components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Money:
      type: object
      required:
      - amount
      - currency
      properties:
        amount:
          type: integer
          description: Plus petite unité monétaire entière (pas de décimales en XAF et XOF)
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217 (XAF ou XOF en V1)
    Problem:
      type: object
      description: Erreur au format problem+json (RFC 9457). Les clients n'affichent jamais `detail` tel quel.
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Code stable, voir x-error-codes
        detail:
          type: string
        traceId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
    StatutCompte:
      type: string
      enum:
      - Actif
      - Suspendu
      - Supprime
    Capacite:
      type: string
      enum:
      - Client
      - Prestataire
    StatutProfil:
      type: string
      enum:
      - Brouillon
      - Actif
      - Suspendu
    Niveau:
      type: string
      enum:
      - N0
      - N1
      - N2
      - N3
    ModeCouverture:
      type: string
      enum:
      - Quartier
      - Ville
      - Rayon
      - Pays
    LocalisationActive:
      type: string
      enum:
      - Travail
      - Domicile
    TypeVerification:
      type: string
      enum:
      - Telephone
      - Identite
      - Activite
      - Autre
    EtatValidation:
      type: string
      enum:
      - EnAttente
      - Validee
      - Rejetee
    FamilleService:
      type: string
      enum:
      - Numerique
      - Domicile
      - Travaux
      - Vente
      - Livraison
    TypeValeur:
      type: string
      enum:
      - Texte
      - Nombre
      - Booleen
      - Liste
    TypeOffre:
      type: string
      enum:
      - Service
      - Bien
    Modalite:
      type: string
      enum:
      - ADistance
      - ADomicile
      - EnLocal
    ModePrix:
      type: string
      enum:
      - Fixe
      - Horaire
      - SurDevis
    Portee:
      type: string
      enum:
      - Locale
      - Internationale
    StatutOffre:
      type: string
      enum:
      - Brouillon
      - Publiee
      - Desactivee
    EtatCreneau:
      type: string
      enum:
      - Libre
      - Reserve
    StatutDemande:
      type: string
      enum:
      - Ouverte
      - Attribuee
      - Expiree
      - Fermee
    StatutProposition:
      type: string
      enum:
      - Active
      - Retiree
      - Refusee
      - Retenue
      - NonRetenue
    TypeTransaction:
      type: string
      enum:
      - Prestation
      - Vente
      - Livraison
    OrigineTransaction:
      type: string
      enum:
      - Offre
      - Demande
    StatutTransaction:
      type: string
      enum:
      - EnAttente
      - Acceptee
      - Planifiee
      - EnCours
      - Terminee
      - Confirmee
      - Cloturee
      - Annulee
      - Contestee
    ModeRemise:
      type: string
      enum:
      - Retrait
      - Livraison
    StatutConversation:
      type: string
      enum:
      - Ouverte
      - LectureSeule
    TypeMessage:
      type: string
      enum:
      - Texte
      - Fichier
      - Systeme
    TypeJustificatif:
      type: string
      enum:
      - Photo
      - Document
      - Livrable
      - Autre
    StatutPaiement:
      type: string
      enum:
      - Initie
      - Reserve
      - Libere
      - Rembourse
      - Echoue
    StatutReversement:
      type: string
      enum:
      - EnAttente
      - Effectue
      - Echoue
    MotifLitige:
      type: string
      enum:
      - NonConforme
      - Retard
      - Absence
      - Autre
    StatutLitige:
      type: string
      enum:
      - Ouvert
      - EnInstruction
      - Decide
    DecisionLitige:
      type: string
      enum:
      - LiberationTotale
      - LiberationPartielle
      - Remboursement
    StatutEvaluation:
      type: string
      enum:
      - Publiee
      - Masquee
    Canal:
      type: string
      enum:
      - Push
      - Email
      - InApp
    TypeNotification:
      type: string
      enum:
      - NouvelleDemande
      - NouvelleProposition
      - PropositionRetenue
      - PropositionNonRetenue
      - CommandeRecue
      - CommandeAcceptee
      - FondsReserves
      - PrestationTerminee
      - PrestationConfirmee
      - LitigeOuvert
      - LitigeDecide
      - NouveauMessage
      - ProfilVerifie
    StatutEnvoi:
      type: string
      enum:
      - EnAttente
      - Envoye
      - Echec
    Visibilite:
      type: string
      enum:
      - Prive
      - Public
    user:
      type: object
      required:
      - id
      - phone
      - displayName
      - language
      - phoneVerified
      - emailVerified
      - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant (UUID v7)
        phone:
          type: string
          description: E.164, 16 caractères au plus
        email:
          type: string
          description: 254 caractères au plus
        displayName:
          type: string
          description: 60 caractères au plus ; visible des autres utilisateurs
        language:
          type: string
          maxLength: 2
          description: ISO 639-1, défaut fr
        countryCode:
          type: string
          maxLength: 2
          description: Pays de résidence (ISO 3166-1 alpha-2)
        phoneVerified:
          type: boolean
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
          description: UTC
    account:
      type: object
      required:
      - user
      - capacities
      - providerStatus
      - permissions
      properties:
        user:
          $ref: '#/components/schemas/user'
        capacities:
          type: array
          items:
            $ref: '#/components/schemas/Capacite'
          description: Client toujours présent ; Prestataire dérivé du profil actif (D19)
        providerStatus:
          oneOf:
          - $ref: '#/components/schemas/StatutProfil'
          - type: 'null'
          description: null = aucun profil prestataire ; la bascule Client / Prestataire n'est proposée que si Actif
        permissions:
          type: array
          items:
            type: string
          description: Codes de permission administrateur ; [] pour un compte ordinaire
    tokenPair:
      type: object
      required:
      - accessToken
      - refreshToken
      - expiresIn
      properties:
        accessToken:
          type: string
          description: JWT, 15 minutes
        refreshToken:
          type: string
          description: À usage unique (rotation), 30 jours
        expiresIn:
          type: integer
          description: Durée de vie du jeton d'accès en secondes (900)
    location:
      type: object
      required:
      - id
      - city
      - countryCode
      properties:
        id:
          type: string
          format: uuid
        city:
          type: string
          maxLength: 80
          description: Ville
        district:
          type: string
          maxLength: 80
          description: Quartier ; absent = niveau ville
        countryCode:
          type: string
          maxLength: 2
    category:
      type: object
      required:
      - id
      - name
      - order
      - active
      - family
      - minVerificationLevel
      - children
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 80
        order:
          type: integer
          description: Ordre d'affichage
        active:
          type: boolean
          description: false seulement avec includeInactive (EP-021)
        family:
          allOf:
          - $ref: '#/components/schemas/FamilleService'
          description: Héritée du parent
        minVerificationLevel:
          allOf:
          - $ref: '#/components/schemas/Niveau'
          description: Niveau requis pour publier ou répondre
        children:
          type: array
          items:
            $ref: '#/components/schemas/category'
          description: '[] pour une catégorie feuille'
    attributeDefinition:
      type: object
      required:
      - id
      - name
      - valueType
      - required
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 60
          description: Unique dans la catégorie
        valueType:
          $ref: '#/components/schemas/TypeValeur'
        required:
          type: boolean
        options:
          type: array
          items:
            type: string
          description: Valeurs possibles ; requis si valueType = Liste (500 caractères au total au plus)
    providerSummary:
      type: object
      required:
      - id
      - businessName
      - level
      - rating
      - reviewCount
      - city
      - quartier
      - completionRate
      - avatarUrl
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant du profil (= identifiant de l'utilisateur)
        businessName:
          type: string
          maxLength: 80
        level:
          $ref: '#/components/schemas/Niveau'
        rating:
          type:
          - number
          - 'null'
          description: 1 à 5, deux décimales ; null sans avis
        reviewCount:
          type: integer
        city:
          type:
          - string
          - 'null'
          description: Niveau quartier au plus, jamais le domicile précis
        quartier:
          type:
          - string
          - 'null'
        completionRate:
          type:
          - number
          - 'null'
          description: Taux de prestations achevées, 0 à 100 (OP-24) ; EP-037 seulement
        avatarUrl:
          type:
          - string
          - 'null'
          description: Lien signé de courte durée (EP-114) ; null tant que la photo de profil n'existe pas (OP-30)
    offerSummary:
      type: object
      required:
      - id
      - title
      - categoryName
      - type
      - modality
      - pricingMode
      - price
      - photoUrl
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 120
        categoryName:
          type:
          - string
          - 'null'
        type:
          $ref: '#/components/schemas/TypeOffre'
        modality:
          $ref: '#/components/schemas/Modalite'
        pricingMode:
          $ref: '#/components/schemas/ModePrix'
        price:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
          description: null si pricingMode = SurDevis
        photoUrl:
          type:
          - string
          - 'null'
          description: Lien signé de courte durée (EP-114) ; null tant que les photos d'offre n'existent pas (OP-30)
    offerSearchItem:
      type: object
      required:
      - offer
      - provider
      - distanceKm
      properties:
        offer:
          $ref: '#/components/schemas/offerSummary'
        provider:
          allOf:
          - $ref: '#/components/schemas/providerSummary'
          description: Sans completionRate
        distanceKm:
          type:
          - number
          - 'null'
          description: null sans point de référence (ni locationId ni lat+lng)
    offerDetail:
      type: object
      required:
      - offer
      - provider
      - items
      - freeSlots
      properties:
        offer:
          type: object
          description: 'offerSummary + champs : Ajoute description (string 2000), photoUrls (string[]), attributes ([{definitionId,
            name, value}]) et status (StatutOffre, présent pour le propriétaire seulement)'
        provider:
          allOf:
          - $ref: '#/components/schemas/providerSummary'
          description: Avec completionRate et avatarUrl
        items:
          type: array
          items:
            $ref: '#/components/schemas/offerItem'
          description: '[] si l''offre n''est pas un bien'
        freeSlots:
          type: array
          items:
            $ref: '#/components/schemas/slot'
          description: Créneaux libres du profil ; [] si l'offre ne se fait pas sur rendez-vous
    offerItem:
      type: object
      required:
      - id
      - designation
      - price
      - available
      - photoUrl
      properties:
        id:
          type: string
          format: uuid
        designation:
          type: string
          maxLength: 120
        price:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: '> 0'
        available:
          type: boolean
          description: Le stock n'est pas géré (D13)
        photoUrl:
          type:
          - string
          - 'null'
          description: Lien signé (EP-114)
    slot:
      type: object
      required:
      - id
      - start
      - end
      properties:
        id:
          type: string
          format: uuid
        start:
          type: string
          format: date-time
          description: UTC
        end:
          type: string
          format: date-time
          description: UTC, après start
    providerProfile:
      type: object
      required:
      - userId
      - businessName
      - description
      - level
      - status
      - portfolioUrl
      - videoUrl
      - workLocation
      - homeLocation
      - activeLocation
      - coverageMode
      - radiusKm
      - workLandmark
      - domains
      - rating
      - reviewCount
      - completionRate
      - profileCompleteness
      properties:
        userId:
          type: string
          format: uuid
        businessName:
          type: string
          maxLength: 80
        description:
          type:
          - string
          - 'null'
          maxLength: 1000
        level:
          $ref: '#/components/schemas/Niveau'
        status:
          $ref: '#/components/schemas/StatutProfil'
        portfolioUrl:
          type:
          - string
          - 'null'
          maxLength: 300
        videoUrl:
          type:
          - string
          - 'null'
          maxLength: 300
        workLocation:
          oneOf:
          - $ref: '#/components/schemas/location'
          - type: 'null'
        homeLocation:
          oneOf:
          - $ref: '#/components/schemas/location'
          - type: 'null'
          description: Niveau quartier ; renvoyé au propriétaire seulement (jamais en public)
        activeLocation:
          allOf:
          - $ref: '#/components/schemas/LocalisationActive'
          description: Doit pointer une adresse renseignée
        coverageMode:
          $ref: '#/components/schemas/ModeCouverture'
        radiusKm:
          type:
          - integer
          - 'null'
          description: 1 à 500 ; obligatoire en mode Rayon
        workLandmark:
          type:
          - string
          - 'null'
          maxLength: 200
          description: Visible du client après acceptation seulement
        domains:
          type: object
          description: '[{id, name}] : 1 à 5 catégories'
        rating:
          type:
          - number
          - 'null'
        reviewCount:
          type: integer
        completionRate:
          type:
          - number
          - 'null'
          description: Taux de prestations achevées, 0 à 100 (OP-24)
        profileCompleteness:
          type: number
          description: Complétude du profil, 0 à 100 (OP-24)
    verification:
      type: object
      required:
      - id
      - type
      - status
      - rejectionReason
      - requestedAt
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TypeVerification'
        status:
          $ref: '#/components/schemas/EtatValidation'
        rejectionReason:
          type:
          - string
          - 'null'
          maxLength: 200
          description: Présent si Rejetee
        requestedAt:
          type: string
          format: date
    notification:
      type: object
      required:
      - id
      - type
      - content
      - read
      - createdAt
      - transactionId
      - requestId
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TypeNotification'
        content:
          type: string
          maxLength: 500
          description: Rendu dans la langue du destinataire
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
        transactionId:
          type:
          - string
          - 'null'
          format: uuid
        requestId:
          type:
          - string
          - 'null'
          format: uuid
    unreadCount:
      type: object
      required:
      - count
      properties:
        count:
          type: integer
    transactionSummary:
      type: object
      required:
      - id
      - reference
      - type
      - origin
      - title
      - status
      - counterpartName
      - total
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          maxLength: 20
          description: Ex. SN-2026-000123
        type:
          $ref: '#/components/schemas/TypeTransaction'
        origin:
          $ref: '#/components/schemas/OrigineTransaction'
        title:
          type: string
          description: Titre de l'offre (voie A) ou de la demande (voie B), figé à l'accord
        status:
          $ref: '#/components/schemas/StatutTransaction'
        counterpartName:
          type:
          - string
          - 'null'
          description: Nom affiché de l'autre partie
        total:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
          description: Null tant que le total n'est pas figé
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    requestInput:
      type: object
      required:
      - categoryId
      - title
      - description
      properties:
        categoryId:
          type: string
          format: uuid
          description: Catégorie feuille active (CATEGORY_NOT_LEAF sinon)
        locationId:
          type: string
          format: uuid
          description: Vide = à distance ou pays
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        deadline:
          type: string
          format: date
          description: yyyy-MM-dd
        budget:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: amount > 0
    requestCreated:
      type: object
      required:
      - requestId
      - recipientCount
      properties:
        requestId:
          type: string
          format: uuid
        recipientCount:
          type: integer
          description: Nombre réel de prestataires notifiés (D07)
    requestFeedItem:
      type: object
      required:
      - request
      - proposalCount
      - maxProposals
      properties:
        request:
          type: object
          description: '{id, title, description, categoryId, categoryName, location, deadline, budget, expiresAt, createdAt}
            : location, deadline et budget peuvent être null ; l''identité et les coordonnées du client ne sont jamais renvoyées'
        proposalCount:
          type: integer
        maxProposals:
          type: integer
          description: Copie du paramètre maxPropositionsParDemande
    problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          description: URI du type
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable, voir feuille Erreurs
        detail:
          type: string
          description: Jamais affiché tel quel par les clients
        traceId:
          type: string
        errors:
          type: object
          description: '[{field, code}] : Erreurs de validation (422)'
    PageOf_notification:
      type: object
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/notification'
        nextCursor:
          type:
          - string
          - 'null'
          description: Opaque ; null = dernière page
    PageOf_offerSearchItem:
      type: object
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/offerSearchItem'
        nextCursor:
          type:
          - string
          - 'null'
          description: Opaque ; null = dernière page
    PageOf_offerSummary:
      type: object
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/offerSummary'
        nextCursor:
          type:
          - string
          - 'null'
          description: Opaque ; null = dernière page
    PageOf_requestFeedItem:
      type: object
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/requestFeedItem'
        nextCursor:
          type:
          - string
          - 'null'
          description: Opaque ; null = dernière page
    PageOf_transactionSummary:
      type: object
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/transactionSummary'
        nextCursor:
          type:
          - string
          - 'null'
          description: Opaque ; null = dernière page
  responses:
    Unauthorized:
      description: Jeton absent, expiré ou révoqué (UNAUTHENTICATED, TOKEN_EXPIRED, TOKEN_REVOKED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Droit manquant (FORBIDDEN)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: Entrée invalide (VALIDATION_FAILED), détail dans `errors`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  x-error-codes:
    VALIDATION_FAILED:
      status: 422
      title: Données invalides
      when: Champ manquant ou hors format ; détail dans errors[]
    UNAUTHENTICATED:
      status: 401
      title: Authentification requise
      when: Jeton absent ou invalide
    TOKEN_EXPIRED:
      status: 401
      title: Jeton expiré
      when: À renouveler via /auth/refresh
    TOKEN_REVOKED:
      status: 401
      title: Jeton révoqué
      when: Déconnexion ou réutilisation d'un jeton de renouvellement
    FORBIDDEN:
      status: 403
      title: Accès refusé
      when: Rôle ou permission insuffisants, ou ressource d'un autre utilisateur
    NOT_FOUND:
      status: 404
      title: Ressource introuvable
      when: Inexistante ou non visible
    INVALID_TRANSITION:
      status: 409
      title: Transition impossible
      when: L'état actuel ne permet pas l'action (matrice)
    VERSION_CONFLICT:
      status: 412
      title: Version périmée
      when: If-Match différent de la version courante
    IDEMPOTENCY_KEY_REUSED:
      status: 422
      title: Clé d'idempotence réutilisée
      when: Même clé, corps différent
    RATE_LIMITED:
      status: 429
      title: Trop de requêtes
      when: Limite atteinte ; voir Retry-After
    INVALID_CREDENTIALS:
      status: 401
      title: Identifiants incorrects
      when: Connexion
    ACCOUNT_SUSPENDED:
      status: 423
      title: Compte suspendu
      when: Décision administrateur
    PHONE_ALREADY_USED:
      status: 409
      title: Numéro déjà utilisé
      when: Inscription
    CODE_INVALID:
      status: 422
      title: Code incorrect
      when: Code SMS ou de réinitialisation
    CODE_EXPIRED:
      status: 422
      title: Code expiré
      when: Code SMS ou de réinitialisation
    PROVIDER_ALREADY_ACTIVE:
      status: 409
      title: Capacité déjà active
      when: Activation prestataire
    DOMAIN_LIMIT_EXCEEDED:
      status: 422
      title: Trop de domaines
      when: Plus de 5 domaines ou aucun
    PROFILE_NOT_ACTIVE:
      status: 403
      title: Profil prestataire inactif
      when: Publication d'offre ou réponse à une demande
    VERIFICATION_LEVEL_TOO_LOW:
      status: 403
      title: Niveau de vérification insuffisant
      when: Minimum de la catégorie non atteint
    OFFER_NOT_AVAILABLE:
      status: 409
      title: Offre non disponible
      when: Offre non valable au moment de la commande
    SLOT_TAKEN:
      status: 409
      title: Créneau déjà réservé
      when: Commande ou planification
    SLOT_OVERLAP:
      status: 409
      title: Créneaux qui se chevauchent
      when: Ajout de créneau
    ITEM_UNAVAILABLE:
      status: 409
      title: Article indisponible
      when: Commande
    TOO_MANY_PENDING_ORDERS:
      status: 429
      title: Trop de commandes en attente
      when: Limite anti-abus
    TOO_MANY_OPEN_REQUESTS:
      status: 429
      title: Trop de demandes ouvertes
      when: Limite anti-abus
    PROPOSAL_CAP_REACHED:
      status: 409
      title: Plafond de propositions atteint
      when: Dix propositions actives par défaut
    ALREADY_PROPOSED:
      status: 409
      title: Proposition déjà envoyée
      when: Une par prestataire et par demande
    NOT_ELIGIBLE:
      status: 403
      title: Prestataire non éligible
      when: Domaine, couverture ou niveau de vérification
    FUNDS_NOT_RESERVED:
      status: 409
      title: Fonds non réservés
      when: Planification, démarrage ou préparation de livraison
    PAYMENT_NOT_ALLOWED_STATE:
      status: 409
      title: Paiement impossible dans cet état
      when: Transaction non acceptée
    OPERATOR_UNAVAILABLE:
      status: 503
      title: Opérateur de paiement indisponible
      when: Réessayer plus tard
    SIGNATURE_INVALID:
      status: 401
      title: Signature de rappel invalide
      when: Webhook
    DISPUTE_WINDOW_CLOSED:
      status: 409
      title: Fenêtre de contestation close
      when: Plus de 72 h après « Terminée »
    DISPUTE_ALREADY_OPEN:
      status: 409
      title: Litige déjà ouvert
      when: Un litige par transaction
    TRANSACTION_NOT_CONFIRMED:
      status: 409
      title: Transaction non confirmée
      when: Évaluation prématurée
    REVIEW_ALREADY_SUBMITTED:
      status: 409
      title: Évaluation déjà déposée
      when: Une par auteur
    REFUND_EXCEEDS_PAID:
      status: 422
      title: Remboursement supérieur au montant payé
      when: Décision de litige
    INVALID_CODE:
      status: 422
      title: Code de remise incorrect
      when: Réponse avec essais restants
    CODE_LOCKED:
      status: 423
      title: Code de remise verrouillé
      when: Trop d'essais
    ALREADY_CLAIMED:
      status: 409
      title: Livraison déjà prise
      when: Un autre livreur a accepté
    DELIVERY_EXPIRED:
      status: 410
      title: Demande de livraison expirée
      when: Aucun preneur dans le délai
    CONVERSATION_READ_ONLY:
      status: 409
      title: Conversation en lecture seule
      when: Litige ouvert ou transaction clôturée
    FILE_TOO_LARGE:
      status: 413
      title: Fichier trop volumineux
      when: Téléversement
    FILE_TYPE_NOT_ALLOWED:
      status: 415
      title: Type de fichier refusé
      when: Téléversement
    ACTIVE_LOCATION_EMPTY:
      status: 422
      title: Localisation active vide
      when: La localisation active pointe une adresse non renseignée
    ADDRESS_REQUIRED:
      status: 422
      title: Adresse requise
      when: Commande à domicile ou travaux sans adresse d'intervention
    AMOUNT_MISMATCH:
      status: 422
      title: Montant incorrect
      when: Le montant du paiement ne correspond pas au total de la transaction
    ATTRIBUTE_REQUIRED:
      status: 422
      title: Caractéristique obligatoire manquante
      when: Une caractéristique obligatoire de la catégorie n'est pas renseignée
    CANCEL_NOT_ALLOWED_IN_PROGRESS:
      status: 409
      title: Annulation impossible en cours de prestation
      when: 'Annulation par le client d''une transaction déjà en cours : passer par l''administrateur (D25)'
    CANNOT_SUSPEND_SELF:
      status: 403
      title: Auto-suspension interdite
      when: Un administrateur suspend son propre compte
    CATEGORY_INACTIVE:
      status: 422
      title: Catégorie désactivée
      when: Domaine ou catégorie inactive
    CATEGORY_IN_USE:
      status: 409
      title: Catégorie utilisée
      when: Désactivation d'une catégorie qui porte des offres, des demandes ou des profils
    CATEGORY_NOT_LEAF:
      status: 422
      title: Catégorie non terminale
      when: Une offre ou une demande doit viser une catégorie sans sous-catégorie
    DISPUTE_ALREADY_TAKEN:
      status: 409
      title: Litige déjà pris
      when: Un autre administrateur instruit déjà le litige
    DISPUTE_CLOSED:
      status: 409
      title: Litige clos
      when: Ajout d'une preuve à un litige décidé
    DISPUTE_NOT_IN_PROGRESS:
      status: 409
      title: Litige non en instruction
      when: Décision sur un litige qui n'est pas en instruction
    DUPLICATE_LOCATION:
      status: 409
      title: Localité en double
      when: Le triplet (pays, ville, quartier) existe déjà
    DUPLICATE_NAME:
      status: 409
      title: Nom déjà utilisé
      when: Nom de catégorie ou de caractéristique déjà présent sous le même parent ou dans la même catégorie
    EMAIL_ALREADY_USED:
      status: 409
      title: E-mail déjà utilisé
      when: Adresse e-mail rattachée à un autre compte
    EVIDENCE_REQUIRED:
      status: 422
      title: Justificatif requis
      when: Déclaration de fin de prestation sans justificatif
    FILE_NOT_OWNED:
      status: 403
      title: Fichier d'un autre utilisateur
      when: Le fichier cité n'appartient pas à l'appelant
    HANDOVER_IS_PICKUP:
      status: 422
      title: Mode retrait
      when: Livraison déclarée prête alors que le mode de remise est le retrait
    HANDOVER_LOCKED:
      status: 409
      title: Mode de remise verrouillé
      when: Changement de mode après la prise en charge de la livraison
    INTERNATIONAL_NOT_VALIDATED:
      status: 409
      title: Ouverture internationale non validée
      when: Publication d'une offre internationale sans validation administrateur
    LOCATION_REQUIRED:
      status: 422
      title: Localisation requise
      when: Lieu de travail manquant pour activer le profil
    NOT_A_DELIVERY:
      status: 404
      title: Pas une livraison
      when: La transaction n'est pas de type Livraison
    NOT_A_SALE:
      status: 422
      title: Pas une vente
      when: L'action ne s'applique qu'à une vente
    OFFER_INCOMPLETE:
      status: 422
      title: Offre incomplète
      when: Publication d'une offre à laquelle il manque des éléments (prix, articles…)
    OFFER_LOCKED:
      status: 409
      title: Offre verrouillée
      when: Modification d'un champ figé par une transaction en cours
    OFFER_NOT_A_GOOD:
      status: 422
      title: Offre sans articles
      when: Ajout d'un article à une offre qui n'est pas un bien
    OWN_OFFER:
      status: 403
      title: Offre personnelle
      when: Commande de sa propre offre
    OWN_REQUEST:
      status: 403
      title: Demande personnelle
      when: Proposition sur sa propre demande
    PAYMENT_ALREADY_RESERVED:
      status: 409
      title: Fonds déjà réservés
      when: Nouvelle tentative de paiement alors que les fonds sont déjà réservés
    PAYOUT_NOT_RETRYABLE:
      status: 409
      title: Reversement non relançable
      when: Relance d'un reversement qui n'est pas en échec
    PHONE_NOT_VERIFIED:
      status: 403
      title: Téléphone non vérifié
      when: Connexion avant la confirmation du numéro
    PROFILE_NOT_FOUND:
      status: 404
      title: Profil introuvable
      when: Aucun profil prestataire pour ce compte
    PROPOSAL_NOT_ACTIVE:
      status: 409
      title: Proposition inactive
      when: Modification d'une proposition qui n'est plus Active
    RADIUS_REQUIRED:
      status: 422
      title: Rayon requis
      when: Mode de couverture Rayon sans rayon
    REQUEST_NOT_OPEN:
      status: 409
      title: Demande non ouverte
      when: Action sur une demande qui n'est plus Ouverte
    RESPONSE_WINDOW_EXPIRED:
      status: 409
      title: Délai de réponse dépassé
      when: Acceptation après le délai de réponse du prestataire
    SLOT_RESERVED:
      status: 409
      title: Créneau réservé
      when: Suppression d'un créneau déjà réservé
    UNKNOWN_PERMISSION:
      status: 422
      title: Permission inconnue
      when: Code de permission absent de la liste
    VERIFICATION_NOT_PENDING:
      status: 409
      title: Vérification non en attente
      when: Décision sur une vérification déjà traitée
    VERIFICATION_PENDING:
      status: 409
      title: Vérification déjà en attente
      when: Nouvelle demande du même type avant la décision
