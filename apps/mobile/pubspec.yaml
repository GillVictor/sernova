name: servnova_mobile
description: Application mobile ServNova (client et prestataire, D26).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2 # client HTTP, justifié par D30 (proposée)
  flutter_secure_storage: ^11.2.0 # jeton de rafraîchissement dans le Keychain / Keystore, D31

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
